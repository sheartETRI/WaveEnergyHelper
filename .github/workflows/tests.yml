name: 오프라인 회귀
on: [push, pull_request]
jobs:
  offline:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - scope: runtime
            requirements: requirements-dev.txt
            command: python -m pytest --suite runtime -q
          - scope: research
            requirements: requirements-research.txt
            command: python -m pytest -q
    name: ${{ matrix.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r ${{ matrix.requirements }}
      - run: python -m pip check
      - run: ${{ matrix.command }}
